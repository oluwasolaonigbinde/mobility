# Cardvert on Render — TEMPLATE ONLY (REQ-010). Not deploy-ready.
#
# Read docs/deployment-templates.md before using this file. It lists the go-live gaps this
# template does not close (security headers, webhook reachability, Redis TLS, Mapbox and more).
# Applying this Blueprint creates billable services: do it only with the owner's written approval,
# in Terrax Media's own Render account (REQ-028).
#
# Every secret is `sync: false` (Render asks for it when the Blueprint is applied) and no value is
# committed. Every switch the client has not answered stays off or blank.
# Kept under deploy/render/ so Render never picks it up automatically as a root render.yaml.

envVarGroups:
  - name: cardvert-backend
    envVars:
      # Use "production" only for the live site; the private test website runs as staging.
      - key: ENVIRONMENT
        value: staging
      - key: APP_NAME
        value: cardvert-api
      - key: API_V1_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: REQUEST_ID_HEADER
        value: X-Request-ID
      - key: BACKEND_CORS_ORIGINS
        value: "[]"
      - key: DEFAULT_CURRENCY
        value: NGN

      # Database and cache. Settings require postgresql+asyncpg://user:password@host/db?ssl=require
      # and rediss://:password@host:port. Render's generated connection strings do not have that
      # form, so these are entered by hand (see the deployment document).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      # Signing and encryption keys (generate fresh values; never reuse local ones).
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: PAYOUT_CRYPTO_KEYRING_B64
        sync: false
      - key: PAYOUT_CRYPTO_KEY_VERSION
        value: "1"
      - key: TRIP_EVIDENCE_SIGNING_KEYRING_B64
        sync: false
      - key: TRIP_EVIDENCE_SIGNING_KEY_VERSION
        value: "1"

      # AWS S3 with SSE-KMS default bucket encryption (deploy/aws/). Region and bucket come from
      # the Terrax-owned AWS account.
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_PRESIGN_TTL_SECONDS
        value: "300"
      - key: OBJECT_STORAGE_ORPHAN_TTL_HOURS
        value: "24"
      - key: OBJECT_STORAGE_DOWNLOAD_TTL_SECONDS
        value: "60"

      # ClamAV runs as the private service below; each backend service sets
      # MALWARE_SCANNER_HOST from it (fromService is not allowed in a group).
      - key: MALWARE_SCANNER_PORT
        value: "3310"
      - key: MALWARE_SCANNER_TIMEOUT_SECONDS
        value: "30"

      # Postmark over SMTP. The username and password are both the Postmark server token.
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_SENDER_ADDRESS
        value: support@terraxmedia.com
      - key: EMAIL_SENDER_NAME
        value: Terrax Media
      - key: EMAIL_SMTP_HOST
        value: smtp.postmarkapp.com
      - key: EMAIL_SMTP_PORT
        value: "587"
      - key: EMAIL_SMTP_STARTTLS
        value: "true"
      - key: EMAIL_SMTP_USERNAME
        sync: false
      - key: EMAIL_SMTP_PASSWORD
        sync: false
      - key: EMAIL_RECEIPT_SIGNING_SECRET
        sync: false
      - key: EMAIL_RECEIPT_KEY_ID
        sync: false
      - key: PASSWORD_RESET_PUBLIC_URL
        sync: false
      - key: DRIVER_ACCOUNT_SETUP_PUBLIC_URL
        sync: false

      - key: SENTRY_DSN
        sync: false

      # Client inputs not yet supplied: every one stays off or blank.
      - key: PAYSTACK_SECRET_KEY # REQ-027: blank keeps Paystack disabled.
        sync: false
      - key: INVOICE_ISSUER_EXTERNAL_INPUT_REFERENCE # Accountant sign-off (D42); blank.
        value: ""
      - key: PAYOUT_V4_PUBLISHING_ENABLED # REQ-014 to REQ-016.
        value: "false"
      - key: PAYOUT_AUTOMATIC_APPROVAL_ENABLED # REQ-017, REQ-029, REQ-030.
        value: "false"
      - key: PAYOUT_AUTOMATIC_FREQUENCY
        value: ""
      - key: PAYOUT_AUTOMATIC_BATCH_LIMIT_NGN
        value: ""
      - key: BUDGET_POLICY_EXTERNAL_APPROVED
        value: "false"
      - key: BUDGET_POLICY_ID
        value: ""
      - key: BUDGET_POLICY_REVISION
        value: ""
      - key: BUDGET_ALERT_RATIO
        value: ""
      - key: BUDGET_URGENT_RATIO
        value: ""
      - key: BUDGET_PAUSE_RATIO
        value: ""
      - key: BUDGET_RESUME_RATIO
        value: ""
      - key: PHONE_OPERATOR_EXTERNAL_APPROVED
        value: "false"
      - key: PRIVACY_DISCLOSURE_LIVE_AUTHORIZED # REQ-032 legal pack.
        value: "false"
      - key: PRIVACY_COLLECTION_LIVE_AUTHORIZED
        value: "false"
      - key: PRIVACY_DISCLOSURE_SYNTHETIC_TEST_MODE
        value: "false"
      - key: PRIVACY_COLLECTION_SYNTHETIC_TEST_MODE
        value: "false"
      - key: MEASUREMENT_LIVE_ISSUANCE_AUTHORIZED
        value: "false"
      - key: FILE_KYC_RETENTION_DAYS # Retention unresolved (client answers items 11 and 17).
        value: ""
      - key: DSR_APPROVED_EXCEPTION_REFERENCES
        value: ""
      - key: DRIVER_REGISTRATION_ENABLED
        value: "false"
      - key: ALLOW_DEMO_SEED
        value: "false"
      # No trusted edge on Render yet, so client-IP headers are never trusted.
      - key: LOGIN_RATE_LIMIT_TRUST_CLIENT_IP_HEADER
        value: "false"
      - key: DRIVER_REGISTRATION_RATE_LIMIT_TRUST_CLIENT_IP_HEADER
        value: "false"

      # Client answer 4 (24 Sep 2026) and the owner's weekly renewal choice.
      - key: INSTALLATION_EVIDENCE_UPLOADER_ROLES
        value: driver,admin
      - key: INSTALLATION_EVIDENCE_REQUIRED_VIEWS
        value: front,back,left,right,close_up
      - key: INSTALLATION_EVIDENCE_VALIDITY_HOURS
        value: "168"

      - key: WORKER_SWEEP_INTERVAL_MINUTES
        value: "5"
      - key: WORKER_SWEEP_BATCH_SIZE
        value: "25"
      - key: FRAUD_REVIEW_SLA_DAYS
        value: "7"
      - key: PASSWORD_MIN_LENGTH
        value: "12"

services:
  # FastAPI. Private: only the frontend reaches it (but see the webhook gap in the document).
  - type: pserv
    name: cardvert-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Developer's proposed region (client answers items 10-11 left it to the developer). Where
    # Nigerian personal data is stored still needs the owner's written approval: see the document.
    region: frankfurt
    plan: starter
    preDeployCommand: alembic upgrade head
    envVars:
      - fromGroup: cardvert-backend
      - key: MALWARE_SCANNER_HOST
        fromService:
          type: pserv
          name: cardvert-clamav
          property: host

  - type: worker
    name: cardvert-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: starter
    dockerCommand: arq app.jobs.worker_entry.WorkerSettings
    envVars:
      - fromGroup: cardvert-backend
      - key: MALWARE_SCANNER_HOST
        fromService:
          type: pserv
          name: cardvert-clamav
          property: host

  # Next.js, the only public service. NEXT_PUBLIC_* values are build-time.
  - type: web
    name: cardvert-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: frankfurt
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL # http://<cardvert-api internal host>:8000
        sync: false
      - key: PUBLIC_ORIGIN # https://<app host>.terraxmedia.com once REQ-033 is confirmed.
        sync: false
      - key: SESSION_COOKIE_NAME
        value: __Host-cardvert_session
      - key: LOGIN_RATE_LIMIT_RELAY_CLIENT_IP_HEADER
        value: "false"
      - key: DEMO_LOGIN_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_MAP_STYLE_URL # Mapbox style URL with a URL-restricted public token.
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false

  # ClamAV daemon for upload scanning. Pin the image by digest before use.
  - type: pserv
    name: cardvert-clamav
    runtime: image
    image:
      url: docker.io/clamav/clamav:1.4
    region: frankfurt
    plan: pro # 4 GB: clamd reaches about 3 GB while reloading signatures.

  # Redis (Render Key Value). See the TLS gap in the document before relying on it.
  - type: keyvalue
    name: cardvert-cache
    region: frankfurt
    plan: starter
    ipAllowList: []

databases:
  # Confirm the postgis extension is available on the chosen plan before applying.
  - name: cardvert-db
    region: frankfurt
    plan: basic-1gb
    postgresMajorVersion: "16"
    ipAllowList: []
