x-backend-service: &backend-service
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
  environment: *backend-environment
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  secrets:
    - source: postgres_tls_ca
      target: postgres_tls_ca
    - source: redis_tls_ca
      target: redis_tls_ca
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  networks:
    app: {}
    data: {}
    egress:
      gw_priority: 1

services:
  db:
    image: ${POSTGIS_IMAGE:?POSTGIS_IMAGE is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        cp /run/secrets/postgres_tls_cert /run/cardvert-postgres/server.crt;
        cp /run/secrets/postgres_tls_key /run/cardvert-postgres/server.key;
        cp /run/secrets/postgres_tls_ca /run/cardvert-postgres/ca.crt;
        printf '%s\n'
        'local all all scram-sha-256'
        'hostnossl all all 0.0.0.0/0 reject'
        'hostnossl all all ::/0 reject'
        'hostssl all all 0.0.0.0/0 scram-sha-256'
        'hostssl all all ::/0 scram-sha-256'
        > /run/cardvert-postgres/pg_hba.conf;
        chown -R postgres:postgres /run/cardvert-postgres;
        chmod 0700 /run/cardvert-postgres;
        chmod 0600 /run/cardvert-postgres/server.key;
        chmod 0644 /run/cardvert-postgres/server.crt /run/cardvert-postgres/ca.crt
        /run/cardvert-postgres/pg_hba.conf;
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/run/cardvert-postgres/server.crt
        -c ssl_key_file=/run/cardvert-postgres/server.key
        -c ssl_ca_file=/run/cardvert-postgres/ca.crt
        -c hba_file=/run/cardvert-postgres/pg_hba.conf
        -c password_encryption=scram-sha-256
    environment:
      POSTGRES_DB: mobility
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /run/cardvert-postgres:rw,noexec,nosuid,size=1m,mode=0700
    secrets:
      - source: postgres_tls_ca
        target: postgres_tls_ca
      - source: postgres_tls_cert
        target: postgres_tls_cert
      - source: postgres_tls_key
        target: postgres_tls_key
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql "host=db port=5432 dbname=mobility user=mobility sslmode=verify-full
          sslrootcert=/run/secrets/postgres_tls_ca" -Atc 'SELECT 1' | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - data

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        cp /run/secrets/redis_tls_cert /run/cardvert-redis/server.crt;
        cp /run/secrets/redis_tls_key /run/cardvert-redis/server.key;
        cp /run/secrets/redis_tls_ca /run/cardvert-redis/ca.crt;
        chown -R redis:redis /run/cardvert-redis;
        chmod 0700 /run/cardvert-redis;
        chmod 0600 /run/cardvert-redis/server.key;
        chmod 0644 /run/cardvert-redis/server.crt /run/cardvert-redis/ca.crt;
        exec docker-entrypoint.sh redis-server
        --appendonly yes
        --port 0
        --tls-port 6379
        --tls-cert-file /run/cardvert-redis/server.crt
        --tls-key-file /run/cardvert-redis/server.key
        --tls-ca-cert-file /run/cardvert-redis/ca.crt
        --tls-auth-clients no
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    tmpfs:
      - /run/cardvert-redis:rw,noexec,nosuid,size=1m,mode=0700
    secrets:
      - source: redis_tls_ca
        target: redis_tls_ca
      - source: redis_tls_cert
        target: redis_tls_cert
      - source: redis_tls_key
        target: redis_tls_key
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli --no-auth-warning --tls
          --cacert /run/secrets/redis_tls_ca -h redis -p 6379 ping | grep -qx PONG
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - data

  migrate:
    <<: *backend-service
    profiles: ["release"]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          r=urlopen("http://127.0.0.1:8000/api/v1/health/ready",timeout=6);
          raise SystemExit(0 if r.status == 200 else 1)
      interval: 30s
      timeout: 8s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend-service
    command: ["arq", "app.jobs.worker_entry.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.jobs.worker_entry.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    environment:
      API_BASE_URL: http://api:8000
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:?SESSION_COOKIE_NAME is required}
      LOGIN_RATE_LIMIT_RELAY_CLIENT_IP_HEADER: ${LOGIN_RATE_LIMIT_RELAY_CLIENT_IP_HEADER:-true}
      DEMO_LOGIN_ENABLED: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
      RELEASE_REVISION: ${RELEASE_REVISION:?RELEASE_REVISION is required}
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/login").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      edge: {}
      app:
        ipv4_address: 10.255.254.10
      egress:
        gw_priority: 1

  edge:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    environment:
      EDGE_HOSTNAME: ${EDGE_HOSTNAME:?EDGE_HOSTNAME is required}
      RELEASE_REVISION: ${RELEASE_REVISION:?RELEASE_REVISION is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      edge: {}
      app: {}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_tls_ca:
    file: ${POSTGRES_TLS_CA_FILE:?POSTGRES_TLS_CA_FILE is required}
  postgres_tls_cert:
    file: ${POSTGRES_TLS_CERT_FILE:?POSTGRES_TLS_CERT_FILE is required}
  postgres_tls_key:
    file: ${POSTGRES_TLS_KEY_FILE:?POSTGRES_TLS_KEY_FILE is required}
  redis_tls_ca:
    file: ${REDIS_TLS_CA_FILE:?REDIS_TLS_CA_FILE is required}
  redis_tls_cert:
    file: ${REDIS_TLS_CERT_FILE:?REDIS_TLS_CERT_FILE is required}
  redis_tls_key:
    file: ${REDIS_TLS_KEY_FILE:?REDIS_TLS_KEY_FILE is required}

networks:
  edge:
    internal: false
  app:
    internal: true
    ipam:
      config:
        - subnet: 10.255.254.0/24
  data:
    internal: true
  egress:
    internal: false
