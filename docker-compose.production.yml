name: cardvert-release

x-backend-environment: &backend-environment
  APP_NAME: cardvert-api
  ENVIRONMENT: production
  RELEASE_REVISION: ${RELEASE_REVISION:?RELEASE_REVISION is required}
  API_V1_PREFIX: /api/v1
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  SENTRY_DSN: ${SENTRY_DSN:-}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS is required}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: json
  REQUEST_ID_HEADER: X-Request-ID
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
  JWT_ALGORITHM: HS256
  PAYOUT_CRYPTO_KEYRING_B64: ${PAYOUT_CRYPTO_KEYRING_B64:?PAYOUT_CRYPTO_KEYRING_B64 is required}
  PAYOUT_CRYPTO_KEY_VERSION: ${PAYOUT_CRYPTO_KEY_VERSION:?PAYOUT_CRYPTO_KEY_VERSION is required}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  SESSION_ABSOLUTE_LIFETIME_MINUTES: ${SESSION_ABSOLUTE_LIFETIME_MINUTES:-720}
  ALLOW_DEMO_SEED: "false"
  PRIVACY_DISCLOSURE_SYNTHETIC_TEST_MODE: "false"
  LOGIN_RATE_LIMIT_TRUST_CLIENT_IP_HEADER: ${LOGIN_RATE_LIMIT_TRUST_CLIENT_IP_HEADER:-false}
  LOGIN_RATE_LIMIT_TRUSTED_PROXY_CIDRS: ${LOGIN_RATE_LIMIT_TRUSTED_PROXY_CIDRS:-}
  DRIVER_REGISTRATION_ENABLED: ${DRIVER_REGISTRATION_ENABLED:-false}
  DRIVER_REGISTRATION_RATE_LIMIT_TRUST_CLIENT_IP_HEADER: "false"
  DRIVER_REGISTRATION_RATE_LIMIT_TRUSTED_PROXY_CIDRS: ""
  WORKER_SWEEP_INTERVAL_MINUTES: ${WORKER_SWEEP_INTERVAL_MINUTES:-5}
  WORKER_SWEEP_BATCH_SIZE: ${WORKER_SWEEP_BATCH_SIZE:-25}
  FRAUD_REVIEW_SLA_DAYS: ${FRAUD_REVIEW_SLA_DAYS:-7}
  PING_RETENTION_MONTHS: ${PING_RETENTION_MONTHS:-12}
  PARTITION_PREMAKE_MONTHS: ${PARTITION_PREMAKE_MONTHS:-4}
  PRIVACY_DISCLOSURE_LIVE_AUTHORIZED: ${PRIVACY_DISCLOSURE_LIVE_AUTHORIZED:-false}
  MEASUREMENT_LIVE_ISSUANCE_AUTHORIZED: ${MEASUREMENT_LIVE_ISSUANCE_AUTHORIZED:-false}
  MEASUREMENT_REPORT_METHOD_REFERENCE: ${MEASUREMENT_REPORT_METHOD_REFERENCE:-}
  MEASUREMENT_ROI_METHOD_REFERENCE: ${MEASUREMENT_ROI_METHOD_REFERENCE:-}
  PRIVACY_LEGAL_APPROVAL_REFERENCE: ${PRIVACY_LEGAL_APPROVAL_REFERENCE:-}
  PRIVACY_DISCLOSURE_CONFIG_REFERENCE: ${PRIVACY_DISCLOSURE_CONFIG_REFERENCE:-}
  PRIVACY_QUERY_HISTORY_RETENTION_REFERENCE: ${PRIVACY_QUERY_HISTORY_RETENTION_REFERENCE:-}
  DSR_APPROVED_EXCEPTION_REFERENCES: ${DSR_APPROVED_EXCEPTION_REFERENCES:-}
  OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?OBJECT_STORAGE_ENDPOINT_URL is required}
  OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: ${OBJECT_STORAGE_PUBLIC_ENDPOINT_URL:?OBJECT_STORAGE_PUBLIC_ENDPOINT_URL is required}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:?OBJECT_STORAGE_REGION is required}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
  OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
  OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}
  MALWARE_SCANNER_HOST: ${MALWARE_SCANNER_HOST:-}
  MALWARE_SCANNER_PORT: ${MALWARE_SCANNER_PORT:-3310}
  FILE_KYC_RETENTION_DAYS: ${FILE_KYC_RETENTION_DAYS:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
  EMAIL_SENDER_ADDRESS: ${EMAIL_SENDER_ADDRESS:-}
  EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME:-Cardvert}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
  EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
  EMAIL_SMTP_STARTTLS: ${EMAIL_SMTP_STARTTLS:-false}
  EMAIL_RECEIPT_SIGNING_SECRET: ${EMAIL_RECEIPT_SIGNING_SECRET:-}
  EMAIL_RECEIPT_KEY_ID: ${EMAIL_RECEIPT_KEY_ID:-}
  INVOICE_ISSUER_EXTERNAL_INPUT_REFERENCE: ${INVOICE_ISSUER_EXTERNAL_INPUT_REFERENCE:-}
  BUDGET_POLICY_EXTERNAL_APPROVED: ${BUDGET_POLICY_EXTERNAL_APPROVED:-false}
  BUDGET_POLICY_ID: ${BUDGET_POLICY_ID:-}
  BUDGET_POLICY_REVISION: ${BUDGET_POLICY_REVISION:-}
  BUDGET_ALERT_RATIO: ${BUDGET_ALERT_RATIO:-}
  BUDGET_PAUSE_RATIO: ${BUDGET_PAUSE_RATIO:-}
  BUDGET_RESUME_RATIO: ${BUDGET_RESUME_RATIO:-}
  PHONE_OPERATOR_EXTERNAL_APPROVED: ${PHONE_OPERATOR_EXTERNAL_APPROVED:-false}
  PASSWORD_RESET_PUBLIC_URL: ${PASSWORD_RESET_PUBLIC_URL:-}

x-backend-service: &backend-service
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
  environment: *backend-environment
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  networks:
    app: {}
    data: {}
    egress:
      gw_priority: 1

services:
  db:
    image: ${POSTGIS_IMAGE:?POSTGIS_IMAGE is required}
    environment:
      POSTGRES_DB: mobility
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobility -d mobility"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - data

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - data

  migrate:
    <<: *backend-service
    profiles: ["release"]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          r=urlopen("http://127.0.0.1:8000/api/v1/health/ready",timeout=2);
          raise SystemExit(0 if r.status == 200 else 1)
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend-service
    command: ["arq", "app.jobs.worker_entry.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.jobs.worker_entry.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    environment:
      API_BASE_URL: http://api:8000
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:?SESSION_COOKIE_NAME is required}
      LOGIN_RATE_LIMIT_RELAY_CLIENT_IP_HEADER: ${LOGIN_RATE_LIMIT_RELAY_CLIENT_IP_HEADER:-false}
      DEMO_LOGIN_ENABLED: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
      RELEASE_REVISION: ${RELEASE_REVISION:?RELEASE_REVISION is required}
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/login").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      edge: {}
      app: {}
      egress:
        gw_priority: 1

  edge:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    environment:
      EDGE_HOSTNAME: ${EDGE_HOSTNAME:?EDGE_HOSTNAME is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      edge: {}
      app: {}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  edge:
    internal: false
  app:
    internal: true
  data:
    internal: true
  egress:
    internal: false
