name: mobility-preprod

x-backend-environment: &backend-environment
  APP_NAME: mobility-adtech-api
  ENVIRONMENT: staging
  API_V1_PREFIX: /api/v1
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  SENTRY_DSN: ${SENTRY_DSN:-}
  BACKEND_CORS_ORIGINS: '[]'
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  REQUEST_ID_HEADER: X-Request-ID
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
  JWT_ALGORITHM: HS256
  PAYOUT_CRYPTO_KEYRING_B64: ${PAYOUT_CRYPTO_KEYRING_B64:?PAYOUT_CRYPTO_KEYRING_B64 is required}
  PAYOUT_CRYPTO_KEY_VERSION: ${PAYOUT_CRYPTO_KEY_VERSION:-1}
  INVOICE_ISSUER_EXTERNAL_INPUT_REFERENCE: ${INVOICE_ISSUER_EXTERNAL_INPUT_REFERENCE:-}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  SESSION_ABSOLUTE_LIFETIME_MINUTES: ${SESSION_ABSOLUTE_LIFETIME_MINUTES:-720}
  LOGIN_RATE_LIMIT_TRUST_CLIENT_IP_HEADER: ${LOGIN_RATE_LIMIT_TRUST_CLIENT_IP_HEADER:-false}
  LOGIN_RATE_LIMIT_TRUSTED_PROXY_CIDRS: ${LOGIN_RATE_LIMIT_TRUSTED_PROXY_CIDRS:-}
  ALLOW_DEMO_SEED: "false"
  WORKER_SWEEP_INTERVAL_MINUTES: ${WORKER_SWEEP_INTERVAL_MINUTES:-5}
  FRAUD_REVIEW_SLA_DAYS: ${FRAUD_REVIEW_SLA_DAYS:-7}
  FRAUD_ASSESSMENT_FORMULA_VERSION: ${FRAUD_ASSESSMENT_FORMULA_VERSION:-fraud_assessment_v1}
  ROUTE_REPLAY_DETECTOR_VERSION: ${ROUTE_REPLAY_DETECTOR_VERSION:-route_replay_v1}
  ROUTE_REPLAY_COORDINATE_PRECISION: ${ROUTE_REPLAY_COORDINATE_PRECISION:-5}
  ROUTE_REPLAY_TIME_TOLERANCE_SECONDS: ${ROUTE_REPLAY_TIME_TOLERANCE_SECONDS:-5}
  ROUTE_REPLAY_MIN_VALID_PINGS: ${ROUTE_REPLAY_MIN_VALID_PINGS:-10}
  ROUTE_REPLAY_MIN_DISTANCE_M: ${ROUTE_REPLAY_MIN_DISTANCE_M:-250}
  ROUTE_REPLAY_MAX_EVIDENCE_MATCHES: ${ROUTE_REPLAY_MAX_EVIDENCE_MATCHES:-10}
  WORKER_SWEEP_BATCH_SIZE: ${WORKER_SWEEP_BATCH_SIZE:-25}
  PING_RETENTION_MONTHS: ${PING_RETENTION_MONTHS:-12}
  PARTITION_PREMAKE_MONTHS: ${PARTITION_PREMAKE_MONTHS:-4}

x-backend-service: &backend-service
  build: .
  image: ${BACKEND_IMAGE:-mobility-preprod-backend:local}
  environment: *backend-environment
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    app: {}
    data: {}
    egress:
      gw_priority: 1

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mobility
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobility -d mobility"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    ports: !reset []
    networks:
      - data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    restart: unless-stopped
    ports: !reset []
    networks:
      - data

  migrate:
    <<: *backend-service
    profiles: ["release"]
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: !reset []
    volumes: !reset []
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          r=urlopen("http://127.0.0.1:8000/api/v1/health/ready",timeout=2);
          raise SystemExit(0 if r.status == 200 else 1)
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend-service
    profiles: ["worker"]
    command: ["arq", "app.jobs.worker_entry.WorkerSettings"]
    volumes: !reset []

  frontend:
    profiles: !reset []
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      API_BASE_URL: http://api:8000
      SESSION_COOKIE_NAME: mobility_session
      LOGIN_RATE_LIMIT_RELAY_CLIENT_IP_HEADER: ${LOGIN_RATE_LIMIT_RELAY_CLIENT_IP_HEADER:-false}
      DEMO_LOGIN_ENABLED: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/login").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    ports: !reset []
    depends_on:
      api:
        condition: service_healthy
    networks:
      edge: {}
      app: {}
      egress:
        gw_priority: 1

  edge:
    image: caddy:2.8-alpine
    environment:
      EDGE_HOSTNAME: ${EDGE_HOSTNAME:?EDGE_HOSTNAME is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
    internal: false
  app:
    internal: true
  data:
    internal: true
  # Outbound-only-by-publication convention: this ordinary bridge gives the
  # application containers DNS/HTTPS egress (for example Sentry) but publishes
  # no host port. Database and Redis never join it.
  egress:
    internal: false
