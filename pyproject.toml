[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mobility-adtech-api"
version = "0.1.0"
description = "Backend API for the Mobility AdTech & Audience Attribution Platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1,<26.0",
    # arq pins redis<6, so the effective redis-py within our >=5,<7 range is 5.x.
    "arq>=0.28,<0.29",
    "asyncpg>=0.29,<1.0",
    "boto3>=1.35,<2.0",
    "cryptography>=50,<51",
    "fastapi>=0.115,<1.0",
    # Paystack adapters (app/adapters/payments, app/adapters/disbursement).
    "httpx>=0.27,<1.0",
    "PyJWT>=2.9,<3.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "redis>=5,<9",
    "sentry-sdk[fastapi]>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1.0",
    "coverage[toml]==7.16.0",
    "PyYAML>=6,<7",
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
]
# Static checks run only in CI's backend_static job, not in every test shard.
static = [
    "basedpyright==1.40.1",
    "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]
data_file = "coverage/.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.lcov]
output = "coverage/backend.lcov"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# C901 guards application code only. The app files below already had functions
# over the limit in Lane 1 or the 1 Oct 2026 integration baseline; new files
# are checked in full. Integration adds config, automatic payouts and complaints.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C901"]
"scripts/**" = ["C901"]
"alembic/**" = ["C901"]
"app/adapters/storage/s3.py" = ["C901"]
"app/core/config.py" = ["C901"]
