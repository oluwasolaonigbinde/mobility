# Shared backend environment for the api and worker containers.
x-backend-env: &backend-env
  APP_NAME: mobility-adtech-api
  ENVIRONMENT: local
  API_V1_PREFIX: /api/v1
  DATABASE_URL: postgresql+asyncpg://mobility:mobility@db:5432/mobility
  REDIS_URL: redis://redis:6379/0
  SENTRY_DSN: ${SENTRY_DSN:-}
  BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
  LOG_LEVEL: INFO
  REQUEST_ID_HEADER: X-Request-ID
  JWT_SECRET_KEY: change-me-local-development-secret-at-least-32-bytes
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 60
  SESSION_ABSOLUTE_LIFETIME_MINUTES: ${SESSION_ABSOLUTE_LIFETIME_MINUTES:-720}
  LOGIN_RATE_LIMIT_IP_MAX_FAILURES: ${LOGIN_RATE_LIMIT_IP_MAX_FAILURES:-150}
  LOGIN_RATE_LIMIT_IP_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_IP_WINDOW_SECONDS:-300}
  LOGIN_RATE_LIMIT_ACCOUNT_MAX_FAILURES: ${LOGIN_RATE_LIMIT_ACCOUNT_MAX_FAILURES:-5}
  LOGIN_RATE_LIMIT_ACCOUNT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_ACCOUNT_WINDOW_SECONDS:-900}
  LOGIN_RATE_LIMIT_GLOBAL_MAX_FAILURES: ${LOGIN_RATE_LIMIT_GLOBAL_MAX_FAILURES:-250}
  LOGIN_RATE_LIMIT_GLOBAL_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_GLOBAL_WINDOW_SECONDS:-300}
  LOGIN_RATE_LIMIT_TRUST_CLIENT_IP_HEADER: ${LOGIN_RATE_LIMIT_TRUST_CLIENT_IP_HEADER:-false}
  LOGIN_RATE_LIMIT_TRUSTED_PROXY_CIDRS: ${LOGIN_RATE_LIMIT_TRUSTED_PROXY_CIDRS:-}
  F7_SEED_MAX_TRIPS_PER_DAY: ${F7_SEED_MAX_TRIPS_PER_DAY:-2}
  PASSWORD_MIN_LENGTH: 12
  DEFAULT_CURRENCY: NGN
  MAX_CAMPAIGN_ZONE_AREA_SQ_KM: 5000
  MAX_LOCATION_PINGS_PER_BATCH: 500
  LOCATION_PING_FUTURE_SKEW_SECONDS: 300
  LOCATION_PING_START_SKEW_SECONDS: 900
  MAX_LOCATION_ACCURACY_M: 10000
  MAX_LOCATION_SPEED_MPS: 120
  FRAUD_ASSESSMENT_FORMULA_VERSION: ${FRAUD_ASSESSMENT_FORMULA_VERSION:-fraud_assessment_v1}
  ROUTE_REPLAY_DETECTOR_VERSION: ${ROUTE_REPLAY_DETECTOR_VERSION:-route_replay_v1}
  ROUTE_REPLAY_COORDINATE_PRECISION: ${ROUTE_REPLAY_COORDINATE_PRECISION:-5}
  ROUTE_REPLAY_TIME_TOLERANCE_SECONDS: ${ROUTE_REPLAY_TIME_TOLERANCE_SECONDS:-5}
  ROUTE_REPLAY_MIN_VALID_PINGS: ${ROUTE_REPLAY_MIN_VALID_PINGS:-10}
  ROUTE_REPLAY_MIN_DISTANCE_M: ${ROUTE_REPLAY_MIN_DISTANCE_M:-250}
  ROUTE_REPLAY_MAX_EVIDENCE_MATCHES: ${ROUTE_REPLAY_MAX_EVIDENCE_MATCHES:-10}
  WORKER_SWEEP_INTERVAL_MINUTES: ${WORKER_SWEEP_INTERVAL_MINUTES:-5}
  WORKER_SWEEP_BATCH_SIZE: ${WORKER_SWEEP_BATCH_SIZE:-25}
  PING_RETENTION_MONTHS: ${PING_RETENTION_MONTHS:-12}
  PARTITION_PREMAKE_MONTHS: ${PARTITION_PREMAKE_MONTHS:-4}

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  # Post-trip processing worker (arq): one-off jobs + the periodic sweep (§14).
  worker:
    build: .
    command: arq app.jobs.worker_entry.WorkerSettings
    environment: *backend-env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  # Production-style frontend container. Local dev normally runs
  # `npm run dev` instead — start this with: docker compose --profile full up
  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      API_BASE_URL: http://api:8000
      SESSION_COOKIE_NAME: mobility_session
      LOGIN_RATE_LIMIT_RELAY_CLIENT_IP_HEADER: ${LOGIN_RATE_LIMIT_RELAY_CLIENT_IP_HEADER:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: production
    ports:
      - "3100:3000"
    depends_on:
      - api

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mobility
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
