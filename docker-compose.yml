# Shared backend environment for the api and worker containers.
x-backend-env: &backend-env
  APP_NAME: mobility-adtech-api
  ENVIRONMENT: local
  API_V1_PREFIX: /api/v1
  DATABASE_URL: postgresql+asyncpg://mobility:mobility@db:5432/mobility
  REDIS_URL: redis://redis:6379/0
  SENTRY_DSN: ${SENTRY_DSN:-}
  BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
  LOG_LEVEL: INFO
  REQUEST_ID_HEADER: X-Request-ID
  JWT_SECRET_KEY: change-me-local-development-secret-at-least-32-bytes
  JWT_ALGORITHM: HS256
  PAYOUT_CRYPTO_KEYRING_B64: ${PAYOUT_CRYPTO_KEYRING_B64:?PAYOUT_CRYPTO_KEYRING_B64 is required}
  PAYOUT_CRYPTO_KEY_VERSION: ${PAYOUT_CRYPTO_KEY_VERSION:-1}
  LOGIN_RATE_LIMIT_TRUST_CLIENT_IP_HEADER: ${LOGIN_RATE_LIMIT_TRUST_CLIENT_IP_HEADER:-false}
  LOGIN_RATE_LIMIT_TRUSTED_PROXY_CIDRS: ${LOGIN_RATE_LIMIT_TRUSTED_PROXY_CIDRS:-}
  DRIVER_REGISTRATION_RATE_LIMIT_GLOBAL_MAX_ATTEMPTS: ${DRIVER_REGISTRATION_RATE_LIMIT_GLOBAL_MAX_ATTEMPTS:-100}
  DRIVER_REGISTRATION_RATE_LIMIT_GLOBAL_WINDOW_SECONDS: ${DRIVER_REGISTRATION_RATE_LIMIT_GLOBAL_WINDOW_SECONDS:-3600}
  DRIVER_REGISTRATION_RATE_LIMIT_TRUST_CLIENT_IP_HEADER: ${DRIVER_REGISTRATION_RATE_LIMIT_TRUST_CLIENT_IP_HEADER:-false}
  DRIVER_REGISTRATION_RATE_LIMIT_TRUSTED_PROXY_CIDRS: ${DRIVER_REGISTRATION_RATE_LIMIT_TRUSTED_PROXY_CIDRS:-}
  F7_SEED_MAX_TRIPS_PER_DAY: ${F7_SEED_MAX_TRIPS_PER_DAY:-2}
  DEFAULT_CURRENCY: NGN
  INVOICE_ISSUER_EXTERNAL_INPUT_REFERENCE: ${INVOICE_ISSUER_EXTERNAL_INPUT_REFERENCE:-}
  FRAUD_ASSESSMENT_FORMULA_VERSION: ${FRAUD_ASSESSMENT_FORMULA_VERSION:-fraud_assessment_v1}
  ROUTE_REPLAY_DETECTOR_VERSION: ${ROUTE_REPLAY_DETECTOR_VERSION:-route_replay_v1}
  ROUTE_REPLAY_COORDINATE_PRECISION: ${ROUTE_REPLAY_COORDINATE_PRECISION:-5}
  ROUTE_REPLAY_TIME_TOLERANCE_SECONDS: ${ROUTE_REPLAY_TIME_TOLERANCE_SECONDS:-5}
  ROUTE_REPLAY_MIN_VALID_PINGS: ${ROUTE_REPLAY_MIN_VALID_PINGS:-10}
  ROUTE_REPLAY_MIN_DISTANCE_M: ${ROUTE_REPLAY_MIN_DISTANCE_M:-250}
  ROUTE_REPLAY_MAX_EVIDENCE_MATCHES: ${ROUTE_REPLAY_MAX_EVIDENCE_MATCHES:-10}
  PING_RETENTION_MONTHS: ${PING_RETENTION_MONTHS:-12}
  PARTITION_PREMAKE_MONTHS: ${PARTITION_PREMAKE_MONTHS:-4}
  PRIVACY_LEGAL_APPROVAL_REFERENCE: ${PRIVACY_LEGAL_APPROVAL_REFERENCE:-}
  PRIVACY_MIN_VEHICLES_PER_CELL: ${PRIVACY_MIN_VEHICLES_PER_CELL:-3}
  PRIVACY_MIN_RESOLUTION_M: ${PRIVACY_MIN_RESOLUTION_M:-500}
  OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
  OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: ${OBJECT_STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: cardvert-private
  OBJECT_STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-cardvert-local}
  OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-cardvert-local-secret}
  MALWARE_SCANNER_HOST: clamav
  # Local SMTP transport; production sender and provider remain external inputs.
  EMAIL_PROVIDER: smtp
  EMAIL_SENDER_ADDRESS: no-reply@cardvert.local
  EMAIL_SENDER_NAME: Cardvert Local
  EMAIL_SMTP_HOST: mailpit
  EMAIL_SMTP_PORT: 1025
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
  PAYSTACK_CHECKOUT_RETURN_URL: ${PAYSTACK_CHECKOUT_RETURN_URL:-http://localhost:3000/advertiser/billing/paystack/return}
  PHONE_VERIFICATION_TERRAX_NUMBER: ${PHONE_VERIFICATION_TERRAX_NUMBER:-+2347074200080}
  PASSWORD_RESET_PUBLIC_URL: ${PASSWORD_RESET_PUBLIC_URL:-http://localhost:3000/reset-password}
  DRIVER_ACCOUNT_SETUP_PUBLIC_URL: ${DRIVER_ACCOUNT_SETUP_PUBLIC_URL:-http://localhost:3000/driver-account-setup}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - minio

  # Post-trip processing worker (arq): one-off jobs + the periodic sweep (§14).
  worker:
    build: .
    command: arq app.jobs.worker_entry.WorkerSettings
    environment: *backend-env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - minio
      - clamav
      - mailpit

  # Production-style frontend container. Local dev normally runs
  # `npm run dev` instead — start this with: docker compose --profile full up
  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      API_BASE_URL: http://api:8000
      SESSION_COOKIE_NAME: mobility_session
      LOGIN_RATE_LIMIT_RELAY_CLIENT_IP_HEADER: ${LOGIN_RATE_LIMIT_RELAY_CLIENT_IP_HEADER:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: production
    ports:
      - "3100:3000"
    depends_on:
      - api

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mobility
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cardvert-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cardvert-local-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://localhost:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
        mc mb --ignore-existing local/cardvert-private;
        mc anonymous set none local/cardvert-private;
        mc ilm rule add --expire-days 1 --prefix unconfirmed/ local/cardvert-private
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cardvert-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cardvert-local-secret}

  clamav:
    image: clamav/clamav:1.4
    platform: linux/amd64
    volumes:
      - clamav_signatures:/var/lib/clamav

  mailpit:
    image: axllent/mailpit:v1.30.3
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  minio_data:
  clamav_signatures:
