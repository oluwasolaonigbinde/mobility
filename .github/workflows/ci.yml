name: ci

on:
  push:
    paths:
      - "app/**"
      - "alembic/**"
      - "tests/**"
      - "frontend/**"
      - "scripts/**"
      - "docs/**"
      - ".codex/**"
      - ".github/workflows/**"
      - "openapi.json"
      - "pyproject.toml"
      - "alembic.ini"
      - "Dockerfile"
      - ".env.example"
      - "production.env.example"
      - "requirements-production.in"
      - "requirements-production.txt"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - "Caddyfile"
      - "staging.env.example"
      - "AGENTS.md"
      - ".pre-commit-config.yaml"
  pull_request:
    paths:
      - "app/**"
      - "alembic/**"
      - "tests/**"
      - "frontend/**"
      - "scripts/**"
      - "docs/**"
      - ".codex/**"
      - ".github/workflows/**"
      - "openapi.json"
      - "pyproject.toml"
      - "alembic.ini"
      - "Dockerfile"
      - ".env.example"
      - "production.env.example"
      - "requirements-production.in"
      - "requirements-production.txt"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - "Caddyfile"
      - "staging.env.example"
      - "AGENTS.md"
      - ".pre-commit-config.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  backend:
    name: backend lint · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobility_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REDIS_URL: redis://localhost:6379/0
      RATE_LIMIT_TEST_REDIS_URL: redis://localhost:6379/9
      ARQ_TEST_REDIS_URL: redis://localhost:6379/8
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mobility_test
      F7_SEED_MAX_TRIPS_PER_DAY: "1"
      # Real-integration authority: this job is the release evidence, so every
      # service-gated test must run here. A skip is a hole in the evidence, not a
      # convenience, and tests/conftest.py fails the run on one.
      REQUIRE_REAL_INTEGRATIONS: "1"
      RUN_LOCAL_FILE_INTEGRATION: "1"
      RUN_REPORT_STORAGE_LOCAL_INTEGRATION: "1"
      # Same images and local-only credentials as docker-compose.yml, so CI proves
      # the object store and scanner the product is actually built against.
      LOCAL_MINIO_ENDPOINT: http://localhost:9000
      LOCAL_MINIO_ACCESS_KEY: cardvert-local
      LOCAL_MINIO_SECRET_KEY: cardvert-local-secret
      LOCAL_CLAMAV_HOST: localhost
      REPORT_STORAGE_ENDPOINT_URL: http://localhost:9000
      REPORT_STORAGE_ACCESS_KEY_ID: cardvert-local
      REPORT_STORAGE_SECRET_ACCESS_KEY: cardvert-local-secret
    steps:
      # Check out the candidate commit itself. On pull_request the default ref is a
      # synthetic merge commit, so a green run would be evidence for a SHA that
      # exists nowhere and cannot be re-checked at closure time.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::evidence tree is $actual, not candidate $expected"
            exit 1
          fi
          echo "exact candidate SHA: $actual"

      # Started before the Python install so ClamAV's signature load overlaps it;
      # readiness is asserted below, never assumed.
      - name: Start real MinIO and ClamAV
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$LOCAL_MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$LOCAL_MINIO_SECRET_KEY" \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend test runner dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Validate delivery packages and checklist
        run: python scripts/validate_progress.py
      - run: pip install -e ".[dev]"
      - name: Runtime OpenAPI contract drift check
        env:
          PAYOUT_CRYPTO_KEYRING_B64: '{"1":"AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="}'
        run: python scripts/update_openapi_snapshot.py --check
      - run: ruff check .

      - name: Wait for MinIO and ClamAV
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && break
            if [ "$i" = "60" ]; then
              echo "::error::MinIO never became ready"; docker logs minio; exit 1
            fi
            sleep 2
          done
          docker run --rm --network host \
            -e MINIO_ROOT_USER="$LOCAL_MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$LOCAL_MINIO_SECRET_KEY" \
            --entrypoint /bin/sh minio/mc:RELEASE.2025-07-21T05-28-08Z -c '
              mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb --ignore-existing local/cardvert-private &&
              mc anonymous set none local/cardvert-private'
          # clamd binds its socket only after the signature databases are loaded;
          # connecting earlier would fail the scanner tests for the wrong reason.
          for i in $(seq 1 90); do
            if docker exec clamav clamdcheck.sh; then break; fi
            if [ "$i" = "90" ]; then
              echo "::error::ClamAV never became ready"; docker logs clamav; exit 1
            fi
            sleep 5
          done

      - run: coverage run -m pytest
      - run: coverage lcov
      - uses: actions/upload-artifact@v4
        with:
          name: r17-backend-lcov
          path: coverage/backend.lcov
          if-no-files-found: error
      - name: Pre-production static verification
        run: scripts/verify_preprod.sh

  quality:
    name: lint · types · unit · contract · build
    runs-on: ubuntu-latest
    steps:
      # Check out the candidate commit itself. On pull_request the default ref is a
      # synthetic merge commit, so a green run would be evidence for a SHA that
      # exists nowhere and cannot be re-checked at closure time.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::evidence tree is $actual, not candidate $expected"
            exit 1
          fi
          echo "exact candidate SHA: $actual"

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
        env:
          NODE_OPTIONS: --localstorage-file=${{ runner.temp }}/r17-vitest-localstorage
      - uses: actions/upload-artifact@v4
        with:
          name: r17-frontend-lcov
          path: ${{ github.workspace }}/coverage/frontend/lcov.info
          if-no-files-found: error

      # Contract drift: regenerate types from the committed openapi.json —
      # if the generated schema differs from what's checked in, the backend
      # contract moved without the frontend following.
      - name: Contract drift check
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts \
            || (echo "::error::openapi.json and src/lib/api/schema.d.ts are out of sync — regenerate with 'python scripts/update_openapi_snapshot.py' then 'npm run api:types' and commit." && exit 1)

      - run: npm run build

  coverage:
    name: changed-code coverage policy
    runs-on: ubuntu-latest
    needs: [backend, quality]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: r17-backend-lcov
          path: coverage/artifacts/backend
      - uses: actions/download-artifact@v4
        with:
          name: r17-frontend-lcov
          path: coverage/artifacts/frontend
      - name: Resolve an explicit ancestor base
        id: base
        run: |
          event_base="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$event_base" in [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;; *) echo "::error::missing explicit base SHA"; exit 1;; esac
          git fetch --no-tags origin "$event_base"
          git cat-file -e "$event_base^{commit}"
          if [ "${{ github.event_name }}" = pull_request ]; then base="$(git merge-base "$event_base" HEAD)"; else base="$event_base"; fi
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD || { echo "::error::base is not an ancestor"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Validate immutable baseline and exact ratios
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, subprocess, sys
          from pathlib import Path
          root = Path.cwd(); baseline = json.loads((root / 'coverage/baseline.json').read_text())
          spec = importlib.util.spec_from_file_location('coverage_policy', root / 'scripts/check_changed_coverage.py')
          policy = importlib.util.module_from_spec(spec); sys.modules[spec.name] = policy; spec.loader.exec_module(policy)
          backend = policy._parse_lcov(root / 'coverage/artifacts/backend/backend.lcov', root, root)
          frontend = policy._parse_lcov(root / 'coverage/artifacts/frontend/lcov.info', root / 'frontend', root)
          records = backend | frontend
          groups = {'backend': sorted(path for path in backend if policy._eligible(path)), 'frontend': sorted(path for path in frontend if policy._eligible(path))}
          inventory = groups['backend'] + groups['frontend']
          assert baseline['version'] == 1
          assert baseline['eligible_inventory_sha256'] == hashlib.sha256(('\n'.join(inventory) + '\n').encode()).hexdigest()
          digest = hashlib.sha256()
          for path in ('scripts/check_changed_coverage.py', 'pyproject.toml', 'frontend/package.json', 'frontend/package-lock.json', 'frontend/vitest.config.ts'):
              digest.update(path.encode()); digest.update(b'\0'); digest.update((root / path).read_bytes())
          assert baseline['policy_sha256'] == digest.hexdigest()
          def check(label, actual, expected):
              for metric in ('line', 'branch'):
                  covered, total = actual[f'{metric}_covered'], actual[f'{metric}_total']
                  base_covered, base_total = expected[f'{metric}_covered'], expected[f'{metric}_total']
                  assert covered * base_total >= base_covered * total, f'{label} {metric} coverage regressed'
          check('global', policy._metrics(records.values()), baseline['global'])
          for name, paths in groups.items():
              expected = baseline['critical'][name]
              assert expected['paths'] == paths, f'{name} source inventory changed'
              check(name, policy._metrics(records[path] for path in paths), expected)
          PY
          base="${{ steps.base.outputs.base }}"
          if ! git diff --quiet "$base" -- coverage/baseline.json; then
            parent="$(git rev-parse HEAD^)"
            expected="$(python -c 'import json; print(json.load(open("coverage/baseline.json"))["source_parent_sha"])')"
            changed="$(git diff --name-only HEAD^ HEAD)"
            if [ "${{ github.event_name }}" != push ] || [ "$parent" != "$expected" ] || [ "$changed" != $'.github/workflows/ci.yml\ncoverage/baseline.json\nscripts/check_changed_coverage.py\ntests/test_changed_coverage_policy.py' ]; then
              echo "::error::coverage baseline is immutable after its one bootstrap commit"; exit 1
            fi
          fi
      - name: Enforce changed-code coverage
        run: python scripts/check_changed_coverage.py --base "${{ steps.base.outputs.base }}" --backend-lcov coverage/artifacts/backend/backend.lcov --frontend-lcov coverage/artifacts/frontend/lcov.info --baseline coverage/baseline.json

  e2e:
    name: e2e against the real stack
    runs-on: ubuntu-latest
    needs: [quality, coverage]
    steps:
      # Check out the candidate commit itself. On pull_request the default ref is a
      # synthetic merge commit, so a green run would be evidence for a SHA that
      # exists nowhere and cannot be re-checked at closure time.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::evidence tree is $actual, not candidate $expected"
            exit 1
          fi
          echo "exact candidate SHA: $actual"

      - name: Boot backend (api + PostGIS + Redis)
        working-directory: .
        env:
          LOGIN_RATE_LIMIT_ACCOUNT_MAX_FAILURES: "50"
          LOGIN_RATE_LIMIT_IP_MAX_FAILURES: "500"
          F7_SEED_MAX_TRIPS_PER_DAY: "1"
        run: |
          cp .env.example .env
          sed -i 's/ALLOW_DEMO_SEED=false/ALLOW_DEMO_SEED=true/' .env
          docker compose up -d --build api db redis
          # Fail-closed readiness: /health can answer before Postgres accepts
          # connections, so migrations must wait on the database itself, and
          # both loops must fail the job instead of falling through.
          # pg_isready must probe TCP (-h 127.0.0.1): the unix socket answers
          # during the image's first-boot init server while db:5432 TCP (what
          # alembic/the API dial) is not accepting yet. Require two consecutive
          # successes to ride out the init-phase restart window.
          ok=0
          for i in $(seq 1 60); do
            if docker compose exec -T db pg_isready -h 127.0.0.1 -U mobility -d mobility; then
              ok=$((ok + 1)); [ "$ok" = "2" ] && break
            else
              ok=0
            fi
            if [ "$i" = "60" ]; then echo "::error::Postgres never became ready"; exit 1; fi
            sleep 2
          done
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health && break
            if [ "$i" = "60" ]; then echo "::error::API never became ready"; exit 1; fi
            sleep 2
          done
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m app.seeds.demo

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run e2e (desktop + mobile viewports)
        run: npx playwright test --project=chromium --project=mobile-chrome
        env:
          API_BASE_URL: http://localhost:8000
          # The 429 spec reads this to match the backend's relaxed threshold
          # (set on the boot step above); without it the test loops only the
          # 5-attempt default and never trips the limiter.
          LOGIN_RATE_LIMIT_ACCOUNT_MAX_FAILURES: "50"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7

  r59_real_stack:
    name: R59 real-stack release journey
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$expected" = "$actual"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run the isolated real-stack release journey
        run: ./scripts/run_r59_real_stack.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r59-real-stack
          path: frontend/test-results/r59-real-stack
          retention-days: 14
