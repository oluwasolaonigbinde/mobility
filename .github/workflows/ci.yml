name: ci

on:
  push:
    branches-ignore: ["dependabot/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    working-directory: frontend

jobs:
  backend_static:
    name: backend static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate SHA
        uses: ./.github/actions/verify-candidate-sha
        with:
          candidate-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,static]"
      - name: Validate delivery packages and checklist
        run: python scripts/validate_progress.py
      - name: Runtime OpenAPI contract drift check
        env:
          PAYOUT_CRYPTO_KEYRING_B64: '{"1":"AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="}'
        run: python scripts/update_openapi_snapshot.py --check
      - run: ruff check .
      - name: Type check (fails only on errors missing from .basedpyright/baseline.json)
        run: basedpyright
      - name: Pre-production static verification
        run: scripts/verify_preprod.sh --static-only
      - name: Python dependency vulnerability audit
        run: pip-audit -r requirements-production.txt --require-hashes --disable-pip --progress-spinner off

  backend_tests:
    name: backend tests · shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: .
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobility_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REDIS_URL: redis://localhost:6379/0
      RATE_LIMIT_TEST_REDIS_URL: redis://localhost:6379/9
      ARQ_TEST_REDIS_URL: redis://localhost:6379/8
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mobility_test
      F7_SEED_MAX_TRIPS_PER_DAY: "1"
      REQUIRE_REAL_INTEGRATIONS: "1"
      RUN_LOCAL_FILE_INTEGRATION: "1"
      RUN_REPORT_STORAGE_LOCAL_INTEGRATION: "1"
      LOCAL_MINIO_ENDPOINT: http://localhost:9000
      LOCAL_MINIO_ACCESS_KEY: cardvert-local
      LOCAL_MINIO_SECRET_KEY: cardvert-local-secret
      LOCAL_CLAMAV_HOST: localhost
      REPORT_STORAGE_ENDPOINT_URL: http://localhost:9000
      REPORT_STORAGE_ACCESS_KEY_ID: cardvert-local
      REPORT_STORAGE_SECRET_ACCESS_KEY: cardvert-local-secret
      COVERAGE_FILE: coverage/shard-${{ matrix.shard }}/.coverage.${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate SHA
        uses: ./.github/actions/verify-candidate-sha
        with:
          candidate-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Start real MinIO
        run: |
          ./scripts/ci_load_minio_images.sh
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$LOCAL_MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$LOCAL_MINIO_SECRET_KEY" \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend test runner dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq
      - run: pip install -e ".[dev]"

      - name: Plan authoritative backend shard
        id: shard_plan
        run: |
          shard_dir="coverage/shard-${{ matrix.shard }}"
          mkdir -p "$shard_dir"
          python scripts/pytest_shard.py plan \
            --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 6 \
            --timings scripts/pytest_shard_durations.json \
            --files-output "$shard_dir/files.txt" \
            --manifest-output "$shard_dir/manifest.json"
          if grep -Fxq -e "tests/test_storage_csp_origin.py" \
            -e "tests/test_w403b_synthetic_path.py" "$shard_dir/files.txt"; then
            echo "browser_stack=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser_stack=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Fxq -e "tests/test_storage_csp_origin.py" \
            -e "tests/test_preprod_operations.py" "$shard_dir/files.txt"; then
            echo "caddy=true" >> "$GITHUB_OUTPUT"
          else
            echo "caddy=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Fxq -e "tests/test_kyc_local_integration.py" \
            -e "tests/test_campaign_managed_creatives_local_integration.py" "$shard_dir/files.txt"; then
            echo "clamav=true" >> "$GITHUB_OUTPUT"
          else
            echo "clamav=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start real ClamAV for scanner integration files
        if: steps.shard_plan.outputs.clamav == 'true'
        run: docker run -d --name clamav -p 3310:3310 clamav/clamav:1.4

      - uses: actions/setup-node@v4
        if: steps.shard_plan.outputs.browser_stack == 'true'
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.shard_plan.outputs.browser_stack == 'true'
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        if: steps.shard_plan.outputs.browser_stack == 'true'
        working-directory: frontend

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && break
            if [ "$i" = "60" ]; then
              echo "::error::MinIO never became ready"; docker logs minio; exit 1
            fi
            sleep 2
          done
          docker run --rm --network host \
            -e MINIO_ROOT_USER="$LOCAL_MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$LOCAL_MINIO_SECRET_KEY" \
            --entrypoint /bin/sh minio/mc:RELEASE.2025-07-21T05-28-08Z -c '
              mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb --ignore-existing local/cardvert-private &&
              mc anonymous set none local/cardvert-private'
      - name: Wait for ClamAV
        if: steps.shard_plan.outputs.clamav == 'true'
        run: |
          # clamd binds its socket only after the signature databases are loaded;
          # connecting earlier would fail the scanner tests for the wrong reason.
          for i in $(seq 1 90); do
            if docker exec clamav clamdcheck.sh; then break; fi
            if [ "$i" = "90" ]; then
              echo "::error::ClamAV never became ready"; docker logs clamav; exit 1
            fi
            sleep 5
          done
      - name: Provision Caddy for real CSP and browser checks
        if: steps.shard_plan.outputs.caddy == 'true'
        run: docker pull caddy:2.8-alpine
      - name: Run authoritative backend shard
        run: |
          shard_dir="coverage/shard-${{ matrix.shard }}"
          if [[ ! -s "$shard_dir/files.txt" ]]; then
            echo "::error::pytest shard selection is empty"
            exit 1
          fi
          mapfile -t shard_files < "$shard_dir/files.txt"
          if (( ${#shard_files[@]} == 0 )); then
            echo "::error::pytest shard array is empty"
            exit 1
          fi
          started_at=$SECONDS
          coverage run -m pytest --junitxml="$shard_dir/execution.xml" -- "${shard_files[@]}"
          elapsed_seconds=$((SECONDS - started_at))
          python scripts/pytest_shard.py finalize \
            --manifest "$shard_dir/manifest.json" \
            --coverage-file "$COVERAGE_FILE" \
            --execution-report "$shard_dir/execution.xml" \
            --elapsed-seconds "$elapsed_seconds"
      - uses: actions/upload-artifact@v4
        with:
          name: r17-backend-shard-${{ matrix.shard }}
          path: |
            coverage/shard-${{ matrix.shard }}/.coverage.${{ matrix.shard }}
            coverage/shard-${{ matrix.shard }}/manifest.json
            coverage/shard-${{ matrix.shard }}/execution.xml
          include-hidden-files: true
          if-no-files-found: error

  backend:
    name: backend lint · tests
    if: ${{ always() }}
    needs: [backend_static, backend_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require every backend prerequisite
        env:
          STATIC_RESULT: ${{ needs.backend_static.result }}
          TESTS_RESULT: ${{ needs.backend_tests.result }}
        run: |
          if [[ "$STATIC_RESULT" != "success" || "$TESTS_RESULT" != "success" ]]; then
            echo "::error::backend prerequisites failed: static=$STATIC_RESULT tests=$TESTS_RESULT"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate SHA
        uses: ./.github/actions/verify-candidate-sha
        with:
          candidate-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "coverage[toml]==7.16.0"
      - uses: actions/download-artifact@v4
        with:
          pattern: r17-backend-shard-*
          path: coverage/artifacts/backend
      - name: Verify and combine backend coverage shards
        run: |
          python scripts/pytest_shard.py verify \
            --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --shard-count 6 \
            --artifacts-dir coverage/artifacts/backend \
            --receipt-output coverage/backend-shards.json
          coverage combine coverage/artifacts/backend/r17-backend-shard-*
          coverage lcov
      - name: Record backend coverage producer provenance
        run: |
          python - <<'PY'
          import coverage
          import hashlib
          import json
          import platform
          import subprocess
          import sys
          from pathlib import Path

          report = Path("coverage/backend.lcov")
          shard_receipt = json.loads(Path("coverage/backend-shards.json").read_text())
          runtime = {
              "implementation": platform.python_implementation(),
              "major_minor": f"{sys.version_info.major}.{sys.version_info.minor}",
              "coverage_version": coverage.__version__,
          }
          shard_runtime = shard_receipt["runtime"]
          if any(runtime[key] != shard_runtime[key] for key in runtime):
              raise SystemExit("aggregate runtime differs from shard producers")
          provenance = {
              "version": 1,
              "candidate_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "lcov_sha256": hashlib.sha256(report.read_bytes()).hexdigest(),
              "runtime": runtime,
              "inventory_sha256": shard_receipt["inventory_sha256"],
              "inventory_nodeid_count": shard_receipt["inventory_nodeid_count"],
              "shards": shard_receipt["shards"],
          }
          Path("coverage/backend-provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r17-backend-lcov
          path: |
            coverage/backend.lcov
            coverage/backend-provenance.json
            coverage/backend-shards.json
          if-no-files-found: error

  quality:
    name: lint · types · unit · contract · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Check out the candidate commit itself. On pull_request the default ref is a
      # synthetic merge commit, so a green run would be evidence for a SHA that
      # exists nowhere and cannot be re-checked at closure time.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA
        uses: ./.github/actions/verify-candidate-sha
        with:
          candidate-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
        env:
          NODE_OPTIONS: --localstorage-file=${{ runner.temp }}/r17-vitest-localstorage
      - uses: actions/upload-artifact@v4
        with:
          name: r17-frontend-lcov
          path: ${{ github.workspace }}/coverage/frontend/lcov.info
          if-no-files-found: error

      # Contract drift: regenerate types from the committed openapi.json —
      # if the generated schema differs from what's checked in, the backend
      # contract moved without the frontend following.
      - name: Contract drift check
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts \
            || (echo "::error::openapi.json and src/lib/api/schema.d.ts are out of sync — regenerate with 'python scripts/update_openapi_snapshot.py' then 'npm run api:types' and commit." && exit 1)

      - run: npm run build
      - name: Frontend dependency vulnerability audit
        run: node ../scripts/check_frontend_audit.mjs

  coverage:
    name: changed-code coverage policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, quality]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate SHA
        uses: ./.github/actions/verify-candidate-sha
        with:
          candidate-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: r17-backend-lcov
          path: coverage/artifacts/backend
      - uses: actions/download-artifact@v4
        with:
          name: r17-frontend-lcov
          path: coverage/artifacts/frontend
      - name: Resolve an explicit ancestor base
        id: base
        run: |
          event_base="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$event_base" in [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;; *) echo "::error::missing explicit base SHA"; exit 1;; esac
          git fetch --no-tags origin "$event_base"
          git cat-file -e "$event_base^{commit}"
          if [ "${{ github.event_name }}" = pull_request ]; then base="$(git merge-base "$event_base" HEAD)"; else base="$event_base"; fi
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD || { echo "::error::base is not an ancestor"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Verify controlled baseline provenance and enforce coverage
        run: python scripts/check_changed_coverage.py --base "${{ steps.base.outputs.base }}" --backend-lcov coverage/artifacts/backend/backend.lcov --backend-provenance coverage/artifacts/backend/backend-provenance.json --frontend-lcov coverage/artifacts/frontend/lcov.info --baseline coverage/baseline.json --verify-baseline-provenance

  e2e:
    name: e2e against the real stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Check out the candidate commit itself. On pull_request the default ref is a
      # synthetic merge commit, so a green run would be evidence for a SHA that
      # exists nowhere and cannot be re-checked at closure time.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA
        uses: ./.github/actions/verify-candidate-sha
        with:
          candidate-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Boot backend (api + PostGIS + Redis)
        working-directory: .
        env:
          COMPOSE_FILE: docker-compose.yml:frontend/e2e/support/docker-compose.e2e.yml
          LOGIN_RATE_LIMIT_ACCOUNT_MAX_FAILURES: "50"
          LOGIN_RATE_LIMIT_IP_MAX_FAILURES: "500"
          F7_SEED_MAX_TRIPS_PER_DAY: "1"
        run: |
          ./scripts/ci_load_minio_images.sh
          cp .env.example .env
          sed -i 's/ALLOW_DEMO_SEED=false/ALLOW_DEMO_SEED=true/' .env
          docker compose up -d --build api db redis
          # Fail-closed readiness: /health can answer before Postgres accepts
          # connections, so migrations must wait on the database itself, and
          # both loops must fail the job instead of falling through.
          # pg_isready must probe TCP (-h 127.0.0.1): the unix socket answers
          # during the image's first-boot init server while db:5432 TCP (what
          # alembic/the API dial) is not accepting yet. Require two consecutive
          # successes to ride out the init-phase restart window.
          ok=0
          for i in $(seq 1 60); do
            if docker compose exec -T db pg_isready -h 127.0.0.1 -U mobility -d mobility; then
              ok=$((ok + 1)); [ "$ok" = "2" ] && break
            else
              ok=0
            fi
            if [ "$i" = "60" ]; then echo "::error::Postgres never became ready"; exit 1; fi
            sleep 2
          done
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health && break
            if [ "$i" = "60" ]; then echo "::error::API never became ready"; exit 1; fi
            sleep 2
          done
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m app.seeds.demo

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run e2e (desktop + mobile viewports)
        run: npx playwright test --project=chromium --project=mobile-chrome
        env:
          API_BASE_URL: http://localhost:8000
          # The 429 spec reads this to match the backend's relaxed threshold
          # (set on the boot step above); without it the test loops only the
          # 5-attempt default and never trips the limiter.
          LOGIN_RATE_LIMIT_ACCOUNT_MAX_FAILURES: "50"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7

  r59_real_stack:
    name: R59 real-stack release journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA
        uses: ./.github/actions/verify-candidate-sha
        with:
          candidate-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run the isolated real-stack release journey
        run: |
          ./scripts/ci_load_minio_images.sh
          ./scripts/run_r59_real_stack.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r59-real-stack
          path: frontend/test-results/r59-real-stack
          retention-days: 14
