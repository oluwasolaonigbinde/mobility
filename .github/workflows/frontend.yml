name: frontend

on:
  push:
    branches: ["master", "main", "frontend-*", "f7-*"]
    paths:
      - "frontend/**"
      - "app/**"
      - "alembic/**"
      - "tests/**"
      - "openapi.json"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - "Caddyfile"
      - "staging.env.example"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "app/**"
      - "alembic/**"
      - "tests/**"
      - "openapi.json"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - "Caddyfile"
      - "staging.env.example"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  backend:
    name: backend lint · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobility_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RATE_LIMIT_TEST_REDIS_URL: redis://localhost:6379/9
      ARQ_TEST_REDIS_URL: redis://localhost:6379/8
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mobility_test
      F7_SEED_MAX_TRIPS_PER_DAY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Pre-production static verification
        run: scripts/verify_preprod.sh

  quality:
    name: lint · types · unit · contract · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      # Contract drift: regenerate types from the committed openapi.json —
      # if the generated schema differs from what's checked in, the backend
      # contract moved without the frontend following.
      - name: Contract drift check
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts \
            || (echo "::error::openapi.json and src/lib/api/schema.d.ts are out of sync — regenerate with 'python scripts/update_openapi_snapshot.py' then 'npm run api:types' and commit." && exit 1)

      - run: npm run build

  e2e:
    name: e2e against the real stack
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Boot backend (api + PostGIS + Redis)
        working-directory: .
        env:
          LOGIN_RATE_LIMIT_ACCOUNT_MAX_FAILURES: "50"
          LOGIN_RATE_LIMIT_IP_MAX_FAILURES: "500"
          F7_SEED_MAX_TRIPS_PER_DAY: "1"
        run: |
          cp .env.example .env
          sed -i 's/ALLOW_DEMO_SEED=false/ALLOW_DEMO_SEED=true/' .env
          docker compose up -d --build api db redis
          # wait for readiness
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health && break
            sleep 2
          done
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m app.seeds.demo

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run e2e (desktop + mobile viewports)
        run: npx playwright test --project=chromium --project=mobile-chrome
        env:
          API_BASE_URL: http://localhost:8000
          # The 429 spec reads this to match the backend's relaxed threshold
          # (set on the boot step above); without it the test loops only the
          # 5-attempt default and never trips the limiter.
          LOGIN_RATE_LIMIT_ACCOUNT_MAX_FAILURES: "50"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
