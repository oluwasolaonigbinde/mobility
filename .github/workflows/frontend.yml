name: frontend

on:
  push:
    branches: ["master", "main", "frontend-*"]
    paths: ["frontend/**", "openapi.json", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "openapi.json", ".github/workflows/frontend.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: lint · types · unit · contract · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      # Contract drift: regenerate types from the committed openapi.json —
      # if the generated schema differs from what's checked in, the backend
      # contract moved without the frontend following.
      - name: Contract drift check
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts \
            || (echo "::error::openapi.json and src/lib/api/schema.d.ts are out of sync — run 'npm run api:sync' and commit." && exit 1)

      - run: npm run build

  e2e:
    name: e2e against the real stack
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Boot backend (api + PostGIS + Redis)
        working-directory: .
        run: |
          cp .env.example .env
          sed -i 's/ALLOW_DEMO_SEED=false/ALLOW_DEMO_SEED=true/' .env
          docker compose up -d --build api db redis
          # wait for readiness
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health && break
            sleep 2
          done
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m app.seeds.demo

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run e2e (desktop + mobile viewports)
        run: npx playwright test --project=chromium --project=mobile-chrome
        env:
          API_BASE_URL: http://localhost:8000

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
