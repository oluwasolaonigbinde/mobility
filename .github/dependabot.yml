version: 2
# Security updates only (D169): `open-pull-requests-limit: 0` disables version
# updates; Dependabot security updates keep their own limit and still open PRs.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  # tests/test_ci_integration_authority_r02.py pins the artifact actions' major
  # versions; a major bump must update that contract test in the same PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
